<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Maître Toiturier — Diagnostic & CRM</title>
<meta name="description" content="Demandes, diagnostics de toiture et suivi commercial dans un seul dossier.">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0d0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maître Toiturier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,500&family=Bodoni+Moda:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --panel:#16171a; --panel2:#121316; --panel3:#1d1e22; --line:rgba(255,255,255,.09);
  --text:#f4f4f5; --muted:#b4b6bd; --muted-dim:#8a8d96;
  --gold:#d4af37; --gold2:#c29a2c; --gold-soft:rgba(212,175,55,.12); --gold-line:rgba(212,175,55,.38);
  --red:#e0554a; --red-bg:rgba(224,85,74,.14);
  --blue:#7c9ae8; --blue-bg:rgba(124,154,232,.14);
  --green:#2fa876; --green-bg:rgba(47,168,118,.15);
  --gray-bg:rgba(255,255,255,.07);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 16px 34px -10px rgba(0,0,0,.55);
  --shadow-gold:0 6px 18px -4px rgba(212,175,55,.35);
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:"Playfair Display",Georgia,serif;
  --font-body:"Montserrat","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;overflow-wrap:anywhere;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 600px at 15% -10%,rgba(212,175,55,.09),transparent 60%),var(--bg);background-attachment:fixed}
button,select,input,textarea{font-family:inherit}
h1,h2,h3,.wordmark,.point-title,.stat-value,.list-card .lc-name{font-family:var(--font-display)}
button{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease)}
button:active{transform:scale(.97)}
a,button,.nav-btn,.tab-btn,.pill-btn{-webkit-tap-highlight-color:transparent}
::selection{background:var(--gold-soft);color:var(--text)}
*:focus-visible{outline:2px solid var(--gold-line);outline-offset:2px;border-radius:4px}
#app{display:flex;min-height:100vh;max-width:100vw}

.splash{position:fixed;inset:0;z-index:500;overflow:hidden;background:radial-gradient(900px 600px at 50% 40%,rgba(212,175,55,.10),transparent 65%),#0d0e10;opacity:1;transition:opacity .65s ease}
.splash.exiting{opacity:0;pointer-events:none}
.splash-body{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;padding:24px}
.splash-logo{width:min(230px,58vw);filter:drop-shadow(0 10px 26px rgba(0,0,0,.65))}
.splash-btn{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310;border:none;padding:16px 36px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.3px;cursor:pointer;box-shadow:0 12px 30px -6px rgba(212,175,55,.55);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.splash-btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -6px rgba(212,175,55,.65)}

.login-screen{position:fixed;inset:0;z-index:490;background:radial-gradient(1200px 700px at 50% -10%,rgba(212,175,55,.12),transparent 60%),#0d0e10;display:flex;align-items:center;justify-content:center;padding:24px;animation:overlayIn .35s var(--ease)}
.login-card{width:100%;max-width:380px;background:var(--panel3);border:1px solid var(--line);border-radius:20px;padding:38px 28px 30px;text-align:center;box-shadow:var(--shadow-md)}
.login-logo{width:150px;margin:0 auto 24px;display:block}
.login-card h1{font-size:20px;margin:0 0 6px}
.login-card p{color:var(--muted);font-size:13px;margin:0 0 22px}
.login-card .form-field{text-align:left}
.login-submit{width:100%;margin-top:6px;padding:12px;font-size:14px}
.login-help{margin-top:18px;font-size:11px;color:var(--muted-dim)}

.sidebar{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--panel2),var(--panel));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 6px}
.logo-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.wordmark{font-weight:700;letter-spacing:.5px;font-size:13.5px;line-height:1.3}
.tagline{font-size:10px;color:var(--muted-dim);letter-spacing:1.4px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav-btn{position:relative;text-align:left;padding:10px 12px 10px 16px;border-radius:9px;background:transparent;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;width:100%;transition:background-color .16s var(--ease),color .16s var(--ease),padding-left .16s var(--ease)}
.nav-btn:hover{background:rgba(245,241,233,.06);color:var(--text);padding-left:19px}
.nav-btn.active{background:var(--gold-soft);color:var(--gold);font-weight:600}
.nav-btn.active:before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.sidebar-footer{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-size:11.5px;color:var(--muted-dim)}
.reset-btn{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:11.5px}
.reset-btn:hover{color:var(--text);border-color:var(--muted-dim)}
.sidebar-close{display:none}
.sidebar-backdrop{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap;flex-shrink:0;position:sticky;top:0;z-index:40;background:rgba(11,11,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left .ws{font-size:14px;color:var(--text);font-weight:600}
.topbar-left .date{font-size:12.5px;color:var(--muted);text-transform:capitalize}
.topbar-right{display:flex;align-items:center;gap:12px}
.demo-tag{font-size:11px;color:var(--muted-dim);letter-spacing:.3px}
.role-select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:9px;font-size:13px;max-width:40vw;cursor:pointer}
.role-select:hover{border-color:var(--muted-dim)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(155deg,var(--gold),var(--gold2));color:#0d0e10;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;box-shadow:0 0 0 3px rgba(212,175,55,.16),var(--shadow-sm)}
.disclaimer{padding:7px 32px;font-size:11px;color:var(--muted-dim);border-bottom:1px solid var(--line);background:var(--panel2);flex-shrink:0}
.content{padding:28px 32px 60px;flex:1;position:relative}
@keyframes contentIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content>*{animation:contentIn .32s var(--ease) backwards}
.content>*:nth-child(2){animation-delay:.02s}
.content>*:nth-child(3){animation-delay:.04s}
.content>*:nth-child(4){animation-delay:.06s}
.hamburger-btn{display:none}

.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.page-header h1{font-size:23px;margin:0 0 5px;font-weight:700;letter-spacing:-.3px;font-family:var(--font-display)}
.page-header p{color:var(--muted);font-size:13.5px;margin:0;max-width:520px}
.btn-primary{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310;border:none;padding:10px 17px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap;box-shadow:var(--shadow-gold)}
.btn-primary:hover{filter:brightness(1.07);box-shadow:0 8px 22px -4px rgba(234,192,125,.5)}
.btn-secondary{background:var(--panel3);border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-secondary:hover{border-color:var(--muted-dim);background:var(--panel2)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
.btn-ghost:hover{color:var(--text);border-color:var(--muted-dim);background:rgba(245,241,233,.05)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}

.mj-card{border-color:var(--gold-line)}
.mj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mj-col-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mj-col .row-item{padding:8px 0}
.mj-col .row-title{font-size:13px}
.mj-col .row-sub{font-size:11.5px}
.mj-urgent .mj-col-head{color:#e5484d}
.mj-today .mj-col-head{color:var(--gold)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:hidden;transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.stat-card:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 75%);opacity:.6}
.stat-card:hover{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:var(--shadow-md)}
.stat-value{font-size:25px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat-label{font-size:13px;margin-top:5px}
.stat-sub{font-size:11.5px;color:var(--muted-dim);margin-top:2px}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow-sm);overflow:hidden}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 75%);opacity:.45}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.card-header h3{margin:0;font-size:14.5px;letter-spacing:-.1px;font-family:var(--font-display);font-weight:700}
.card>.card-header:only-child,.card>.card-header:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.link-btn{background:none;border:none;color:var(--gold);font-size:12.5px;cursor:pointer;padding:0;transition:opacity .15s}
.link-btn:hover{opacity:.75}
.empty-note{color:var(--muted-dim);font-size:13px;padding:22px 14px;text-align:center;border:1px dashed var(--line);border-radius:11px;background:rgba(255,255,255,.015)}

.row-item{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;margin:0 -10px;border-bottom:1px solid var(--line);gap:12px;border-radius:9px;transition:background-color .15s}
.row-item:last-child{border-bottom:none}
.row-item:hover{background:rgba(245,241,233,.03)}
.row-item[data-action]{cursor:pointer}
.row-item[data-action]:hover{background:var(--gold-soft)}
.cat-chevron{color:var(--muted-dim);font-size:18px;line-height:1}
.row-left{display:flex;align-items:center;gap:10px;min-width:0}
.row-avatar{width:30px;height:30px;border-radius:50%;background:var(--panel3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;color:var(--muted)}
.row-title{font-size:13.5px;font-weight:600}
.row-sub{font-size:12px;color:var(--muted)}
.date-tile{background:var(--panel3);border:1px solid var(--line);border-radius:9px;padding:6px 10px;text-align:center;font-size:10.5px;font-weight:700;color:var(--gold);flex-shrink:0;line-height:1.2}

.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge:before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:6px;flex-shrink:0}
.badge.red{color:var(--red);background:var(--red-bg)}
.badge.blue{color:var(--blue);background:var(--blue-bg)}
.badge.green{color:var(--green);background:var(--green-bg)}
.badge.gray{color:var(--muted);background:var(--gray-bg)}
.badge.gold{color:var(--gold2);background:var(--gold-soft)}
.badge.black{color:#fff;background:#23262c}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.devis-table-wrap{overflow-x:auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.devis-table-wrap table{min-width:560px}
.devis-table-wrap input{width:100%;padding:6px 7px;font-size:12.5px}
.devis-totals{display:flex;gap:22px;flex-wrap:wrap;padding:12px 0;margin-top:6px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.devis-totals b{color:var(--text);font-family:var(--font-display);font-size:15px;margin-left:4px}
.devis-sub-card{margin-top:12px;border-style:dashed}
.devis-payments .row-item{padding:8px 0}
th{text-align:left;color:var(--muted-dim);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background-color .15s}
tbody tr:hover{background:rgba(245,241,233,.035)}
tr:last-child td{border-bottom:none}
.filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters-row select,.filters-row input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;font-size:13px}
.filters-row input{flex:1;min-width:200px}
.filters-row input:focus,.filters-row select:focus{border-color:var(--gold-line)}

/* Mobile-only patterns: pill selector + full-detail single-column list (hidden on desktop) */
.mobile-list,.agenda-mobile,.kanban-mobile{display:none}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill-btn{flex-shrink:0;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap;transition:background-color .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease)}
.pill-btn.active{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310;border-color:transparent;font-weight:700;box-shadow:var(--shadow-gold)}
.pill-btn .pb-count{margin-left:6px;opacity:.7}
.list-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease);box-shadow:var(--shadow-sm)}
.list-card[data-action]{cursor:pointer}
.list-card[data-action]:hover{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:var(--shadow-md)}
.list-card .lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.list-card .lc-name{font-size:15px;font-weight:700}
.list-card .lc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.list-card .lc-motif{font-size:13.5px;margin:10px 0}
.list-card .lc-badges{display:flex;gap:8px;flex-wrap:wrap}
.list-card .lc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.agenda-day-heading{font-size:14.5px;font-weight:700;margin-bottom:10px}

.breadcrumb{font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;margin-bottom:10px;transition:color .15s}
.breadcrumb:hover{color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 20px;overflow-x:auto}
.tab-btn{padding:10px 16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;background:rgba(20,22,28,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:overlayIn .18s var(--ease)}
.modal{position:relative;background:var(--panel3);border:1px solid var(--line);border-radius:18px;padding:26px 24px 24px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);animation:modalIn .22s var(--ease)}
.modal:before{content:'';position:absolute;top:0;left:18px;right:18px;height:2px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.modal-header h3{margin:0;font-size:17px;font-family:var(--font-display);letter-spacing:-.2px}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:6px;width:28px;height:28px}
.modal-close:hover{color:var(--text);background:rgba(245,241,233,.06)}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--muted-dim);margin-bottom:7px}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{box-shadow:0 0 0 3px var(--gold-soft)}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold-line)}
.form-field select[multiple]{padding:4px}
.form-field select[multiple] option{padding:8px 7px;border-radius:6px}
.form-field textarea{resize:vertical;min-height:64px}
.form-help{font-size:11.5px;color:var(--muted-dim);margin-top:6px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-wide{max-width:780px}
.wz-steps{display:flex;gap:6px;margin:2px 0 18px}
.wz-step{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:8px 10px;border-radius:10px;background:rgba(245,241,233,.04);color:var(--muted);font-size:12px;border:1px solid var(--line)}
.wz-step span{width:22px;height:22px;border-radius:50%;background:rgba(245,241,233,.1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.wz-step em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-step.on{border-color:var(--gold-line);color:var(--text);background:var(--gold-soft)}
.wz-step.on span{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310}
.wz-step.done span{background:var(--green);color:#fff}
.wz-intro{color:var(--muted);font-size:13px;margin:0 0 14px}
.wz-client{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:var(--panel2)}
.wz-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.wz-line-head,.wz-line-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 92px 76px 96px 34px;gap:8px;align-items:center}

.wz-qte-unit input{flex:1 1 0;min-width:0}

.wz-line-row{margin-bottom:8px}
.wz-line-row input,.wz-line-row select{width:100%;padding:8px 9px;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px}

.wz-addbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}

.wz-sugg-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:700}
.wz-chip{background:transparent;border:1px solid var(--gold-line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;margin:0 6px 6px 0}
.wz-chip small{color:var(--muted);margin-left:6px}
.wz-catlist{max-height:190px;overflow-y:auto}
.wz-totals{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin:14px 0}
.wz-tot{display:flex;gap:24px;justify-content:space-between;min-width:230px;font-size:13px;color:var(--muted)}
.wz-tot b{color:var(--text)}
.wz-tot.big{font-size:15px;color:var(--gold);padding-top:6px;border-top:1px solid var(--gold-line)}
.wz-tot.big b{font-family:var(--font-display);font-size:20px;color:var(--gold)}
.wz-preview{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);margin-top:8px}
.wz-sched{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.wz-sched:last-child{border-bottom:none}
.wz-sched.mode{color:var(--muted)}
.wz-recap{border:1px solid var(--line);border-radius:12px;padding:4px 14px;background:var(--panel2);margin-bottom:8px}
.wz-recap-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.wz-recap-row:last-child{border-bottom:none}
.wz-recap-row span{color:var(--muted);flex-shrink:0;white-space:nowrap}
.wz-recap-row b{text-align:right;min-width:0}
.wz-nav{position:sticky;bottom:-24px;background:var(--panel3);padding:14px 0 4px;margin-top:6px}
/* Échéancier de paiement (assistant devis, étape 3) — oublié lors de l'ajout de la fonctionnalité. */
.wz-ech-head{display:grid;grid-template-columns:1fr 64px 96px;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-dim);font-weight:700;margin:16px 0 8px}
.wz-ech-row{display:grid;grid-template-columns:1fr 64px 96px;gap:8px;align-items:center;margin-bottom:8px}
.wz-ech-row input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;width:100%}
.wz-ech-row input:focus{outline:none;border-color:var(--gold-line)}
.wz-ech-amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.wz-pct-wrap{position:relative;display:block}
.wz-pct-wrap input{padding-right:22px;text-align:right}
.wz-pct-wrap i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted-dim);font-size:12px;pointer-events:none}
@media (max-width:700px){
  .wz-ech-head{display:none}
  .wz-ech-row{grid-template-columns:1fr 84px;gap:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;align-items:center}
  .wz-ech-row input[data-field="label"]{grid-column:1/-1}
  .wz-pct-wrap{grid-column:2;grid-row:2}
  .wz-ech-amt{grid-column:1;grid-row:2;text-align:left;font-size:15px;color:var(--gold);align-self:center}
}
.btn-danger{background:#b3232a;color:#fff;border:none;padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
.btn-danger:hover{background:#c92c34}
@media (max-width:700px){.wz-grid{grid-template-columns:1fr}.wz-line-head{display:none}.wz-line-row{grid-template-columns:1fr 1fr 1fr}.wz-line-row input:first-child{grid-column:1/-1}.wz-line-total{grid-column:1/3;text-align:left}.wz-step em{display:none}.wz-step{flex:0 0 auto;padding:8px 10px}.wz-steps{justify-content:center}.wz-nav{flex-wrap:wrap}.wz-nav button{flex:1 1 100%}}
.crm-head-top{display:flex;gap:14px;align-items:center}

.login-msg{background:var(--red-bg);border:1px solid rgba(224,85,74,.4);color:#f1b3ad;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 0 12px;text-align:left}
.login-link{display:block;margin:14px auto 0}
.login-sep{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--muted-dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.login-sep:before,.login-sep:after{content:'';flex:1;height:1px;background:var(--line)}
.signup-ok{width:54px;height:54px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.nav-badge{margin-left:8px;background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.emp-row{flex-wrap:wrap}
.emp-role,.emp-row select{padding:6px 8px;font-size:12.5px}
.copy-row{display:flex;gap:10px;flex-wrap:wrap}

.acc-wrap{overflow-x:auto}
.acc-grid{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(4,minmax(96px,1fr));gap:8px 10px;align-items:center;min-width:560px}
.acc-h{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
.acc-mod{font-size:13px;font-weight:600}
.acc-lock{font-size:12px;color:var(--muted);padding:7px 9px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.acc-lock.off{color:var(--muted-dim)}
.acc-sel,.emp-row select,.wz-line-row select,.wz-addbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px}
.acc-sel{width:100%;padding:7px 8px;font-size:12.5px}
.acc-sel.lv0{color:var(--muted-dim)}

.modal-list-btn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:13px;transition:border-color .15s,transform .15s}
.modal-list-btn:hover{border-color:var(--gold-line);transform:translateX(2px)}

.kanban{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kanban-col{background:var(--panel2);border-radius:14px;padding:12px;border:1px solid var(--line)}
.kanban-col h4{font-size:12px;margin:0 0 10px;color:var(--muted-dim);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kanban-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;font-size:12.5px;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease);box-shadow:var(--shadow-sm)}
.kanban-card:hover{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:var(--shadow-md)}

.kanban-card .kc-sub{color:var(--muted);font-size:11.5px;margin-bottom:6px}
.kanban-card .kc-amount{color:var(--gold);font-weight:700;font-size:12.5px;margin:4px 0}

/* ---- Calendar (day / week / month / year) ---- */
.cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cal-view-switch{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.cal-view-btn{padding:7px 13px;border-radius:7px;background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;transition:background-color .16s var(--ease),color .16s var(--ease)}
.cal-view-btn.active{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310}
.cal-nav-btn{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{border-color:var(--muted-dim)}
.cal-nav-group{display:flex;align-items:center;gap:6px}
.cal-date-btn{position:relative;padding:8px 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;text-transform:capitalize}
.cal-date-btn:hover{border-color:var(--gold-line)}
.cal-today-btn{margin-left:auto}
@media (max-width:520px){.cal-today-btn{margin-left:0}}

.cal-datepicker{position:absolute;top:calc(100% + 8px);left:0;z-index:70;background:var(--panel3);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow-md);width:300px;animation:modalIn .16s var(--ease)}
.cal-datepicker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:700;text-transform:capitalize}
.cal-datepicker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-datepicker-dow{font-size:10px;color:var(--muted-dim);padding:4px 0;font-weight:600}
.cal-datepicker-day{aspect-ratio:1;border-radius:8px;background:none;border:none;color:var(--text);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-datepicker-day:hover{background:rgba(245,241,233,.06)}
.cal-datepicker-day.dim{color:var(--muted-dim)}
.cal-datepicker-day.today{color:var(--gold);font-weight:700}
.cal-datepicker-day.selected{background:linear-gradient(155deg,var(--gold),var(--gold2));color:#171310;font-weight:700}

.cal-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;overflow-x:auto}
.cal-week-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:150px;min-width:120px;transition:border-color .15s}
.cal-week-col.today{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line)}
.cal-week-col h5{margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.cal-week-col h5 b{color:var(--text);font-size:13px}
.cal-week-col.today h5 b{color:var(--gold)}
.cal-event{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:7px;font-size:11.5px;cursor:pointer;transition:border-color .15s,transform .15s}
.cal-event:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.cal-event .ev-time{color:var(--gold);font-weight:700}
.cal-empty{color:var(--muted-dim);font-size:11.5px;font-style:italic}

.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-month-dow{text-align:center;font-size:11px;color:var(--muted-dim);font-weight:600;padding-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.cal-month-cell{aspect-ratio:1;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;min-height:44px}

.cal-month-cell.dim{opacity:.35}
.cal-month-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cal-month-cell.today .cmc-num{color:var(--gold)}
.cal-month-dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.cal-month-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

.cal-year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cal-year-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease);box-shadow:var(--shadow-sm)}

.cal-year-card .cyc-count{font-size:12px;color:var(--muted)}
.cal-year-card .cyc-count b{color:var(--gold)}

.etat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.3px;transition:border-color .15s,background-color .15s,transform .1s}
.etat-btn:hover{transform:translateY(-1px)}
.etat-btn-icon{font-size:20px;line-height:1}
.etat-btn.active{border-color:transparent;color:#fff;box-shadow:var(--shadow-md)}
.etat-btn.etat-bonetat.active{background:linear-gradient(155deg,#2fbf82,var(--green))}

.etat-btn.etat-pasvu.active,.etat-btn.etat-nonpresent.active{background:var(--muted-dim);color:#fff}

.diag-cascade{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.cascade-label{font-size:12.5px;font-weight:700;color:var(--text);margin:14px 0 8px}
.cascade-label:first-child{margin-top:0}
.cascade-hint{font-weight:400;color:var(--muted-dim);font-size:11px;margin-left:4px}
.chip-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.chip-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
.chip-btn:hover{border-color:var(--gold-line)}
.chip-btn.active{background:linear-gradient(155deg,var(--gold),var(--gold2));border-color:transparent;color:#171310;font-weight:700}


.diag-focus-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.diag-focus-title{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pdf-doc{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
.pdf-page{width:210mm;min-height:297mm;background:#f5f1e9;box-shadow:0 10px 34px rgba(20,14,6,.16);position:relative;overflow:hidden;box-sizing:border-box;font-family:inherit;color:#232017}

.pdf-page-num{font-size:9.5px;color:#9c8f74;margin-left:10px;white-space:nowrap}

.doc2-band:after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#c9a53b,#e8c877 40%,#c9a53b 70%,transparent)}
.doc2-band-row{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 16mm}

/* ==================================================================
   Phone & tablet: real app-shell (fixed chrome, no page-level scroll)
   plus mobile-native screens for dense views (agenda/tables/kanban).
   Kept last so it always wins the cascade at matching widths.
   ================================================================== */
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  #app{height:100vh;height:100dvh}
  .main{height:100vh;height:100dvh;overflow:hidden}
  .content{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .topbar-left .ws,.topbar-left .date{display:none}
  .demo-tag{display:none}
  .role-select{max-width:52vw;font-size:12.5px;padding:8px 9px}
  .disclaimer{padding:6px 16px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hamburger-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:36px;height:36px;padding:0;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer;flex-shrink:0}
  .hamburger-btn span,.hamburger-btn:before,.hamburger-btn:after{content:'';display:block;width:16px;height:2px;background:var(--text);border-radius:2px}

  .sidebar{position:fixed;top:0;left:0;z-index:60;width:78vw;max-width:300px;height:100vh;height:100dvh;transform:translateX(-100%);transition:transform .22s ease;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sidebar.open{transform:translateX(0);box-shadow:8px 0 24px rgba(0,0,0,.4)}
  .sidebar-close{display:block;position:absolute;top:calc(16px + env(safe-area-inset-top));right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .sidebar-backdrop{display:block;position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .sidebar-backdrop.open{opacity:1;pointer-events:auto}

  .page-header{margin-bottom:14px}
  .page-header h1{font-size:19px}
  .page-header p{font-size:12.5px}
  .mj-grid{grid-template-columns:1fr;gap:18px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .stat-card{padding:12px 13px;border-radius:10px}
  .stat-value{font-size:19px}
  .stat-label{font-size:11.5px;margin-top:3px}
  .stat-sub{display:none}
  .card{padding:14px}

  /* Dossier detail tabs: no horizontal slide — wrap into a fixed grid instead */
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow-x:visible;border-bottom:none;margin:14px 0 16px}
  .tab-btn{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;white-space:normal;font-size:12px;line-height:1.25}
  .tab-btn.active{background:var(--gold-soft);border-color:var(--gold)}
  .tabs .tab-btn:last-child:nth-child(odd){grid-column:1/-1}

  /* Overview row-items (avatar+name on the left, badge+button on the right) are too
     cramped side-by-side on a phone — stack the action group onto its own line */
  .row-item:has(.row-left){flex-wrap:wrap;row-gap:8px}
  .row-item:has(.row-left)>.row-left{flex:1 1 100%}
  .row-item:has(.row-left)>*:not(.row-left){margin-left:auto}

  /* Prevent iOS Safari auto-zoom-on-focus (font-size<16px triggers it), which
     shifts the viewport and causes an ugly left-right scroll while the keyboard is up */
  input,select,textarea{font-size:16px!important}

  /* Diagnostic step numbers: shrink to fit all steps + Synthèse on one centered line */
  .diag-steps{flex-wrap:nowrap;justify-content:center;gap:3px}
  .diag-step-btn{flex:1;min-width:0;height:24px;padding:0 2px;font-size:9.5px;text-align:center;overflow:hidden;text-overflow:clip;white-space:nowrap}
  .diag-steps .diag-step-btn:last-child{flex:2.2;font-size:9px}

  /* Dense grids/tables become pill-filtered single-column lists */
  .table-wrap{display:none}
  .mobile-list{display:block}
  .kanban{display:none}
  .kanban-mobile{display:block}

  .cal-view-btn{padding:7px 10px;font-size:11.5px}
  .cal-date-btn{font-size:12.5px;padding:7px 11px}
  .cal-nav-btn{width:30px;height:30px}
  .cal-year-grid{grid-template-columns:repeat(2,1fr)}

  /* Week view: no horizontal slide on phone — stack days as a vertical list instead */
  .cal-week-grid{grid-template-columns:1fr;overflow-x:visible;gap:8px}
  .cal-week-col{min-width:0;min-height:0;padding:10px 12px}
  .cal-week-col h5{font-size:12.5px;margin-bottom:4px}
  .cal-week-col .cal-empty{margin:0}

}

.proc-step.done .proc-dot{background:var(--green);color:#fff}
.proc-step.part{opacity:1}
.proc-step.part .proc-dot{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.proc-step.current{opacity:1;border-color:var(--gold-line);background:var(--gold-soft)}
.proc-step.current .proc-dot{background:var(--gold);color:#111}
.proc-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.proc-note{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.proc-btns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.proc-steps{grid-template-columns:repeat(2,1fr)}}

.req{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0;font-size:12.5px;color:var(--muted)}
.pager button:disabled{opacity:.4;cursor:default}
.mat-bar{height:6px;border-radius:99px;background:var(--gray-bg);margin:6px 0 12px;overflow:hidden}
.mat-bar span{display:block;height:100%;background:var(--gold);border-radius:99px}

.mail-frame{width:100%;height:340px;border:1px solid var(--line);border-radius:12px;background:#efeadf}
.mail-sent-ok{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:13.5px;font-weight:600}
.inv-row{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:8px}
@media (max-width:700px){.inv-row{grid-template-columns:1fr}}
.login-msg.ok{color:var(--green);background:var(--green-bg)}

/* ---- Navigation mobile façon application native ---- */
.ni{width:18px;height:18px;flex:none;margin-right:10px;vertical-align:-4px}
.nav-btn{display:flex;align-items:center}
.bottom-nav{display:none}
@media (max-width:900px){
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,19,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
  .bn-item{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:transparent;color:var(--muted-dim);font-size:10.5px;font-weight:600;border-radius:12px;cursor:pointer;min-width:0}
  .bn-item .ni{width:22px;height:22px;margin:0}
  .bn-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn-item.active{color:var(--gold)}
  .bn-item.active .ni{filter:drop-shadow(0 0 6px rgba(212,175,55,.35))}
  .bn-dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom)) !important}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom)) !important}
  .hamburger-btn{display:none !important}
  .pill-row{flex-wrap:wrap;overflow:visible}
  .pill-btn{padding:7px 11px;font-size:12px}
  .acc-wrap{overflow:visible}
  .acc-grid{grid-template-columns:minmax(78px,1.3fr) repeat(4,minmax(0,1fr));min-width:0;gap:6px 5px}
  .acc-grid .acc-sel{font-size:10.5px;padding:6px 2px;width:100%}
  .acc-grid .acc-h{font-size:9.5px;word-break:break-word;text-align:center}
  .devis-table-wrap{overflow:visible}
  .devis-table-wrap table,.devis-table-wrap thead,.devis-table-wrap tbody,.devis-table-wrap tr,.devis-table-wrap td{display:block;min-width:0;width:auto !important}
  .devis-table-wrap thead{display:none}
  .devis-table-wrap tr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .devis-table-wrap td{padding:5px 0;border:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .devis-table-wrap td:before{content:attr(data-label);font-size:11px;color:var(--muted-dim);flex:none}
  .devis-table-wrap td[data-label="Désignation"]{display:block}
  .devis-table-wrap td[data-label="Désignation"]:before{display:block;margin-bottom:4px}
  .devis-table-wrap td input{max-width:60%;text-align:right}
  .devis-table-wrap td[data-label="Désignation"] input{max-width:100%;text-align:left}
  .proc-steps{grid-template-columns:repeat(2,1fr)}
  .modal{max-width:100vw;width:100%;border-radius:18px;max-height:88dvh;margin:0}
  .modal-overlay{align-items:center}
  .card,.list-card{border-radius:16px}
  .btn-primary,.btn-secondary{min-height:44px}
  input,select,textarea{font-size:16px}
}

.pc-row{display:grid;grid-template-columns:2fr 1fr 90px 90px auto;gap:8px;align-items:center;margin-bottom:8px}
.pc-anom{grid-template-columns:56px 1.2fr 2fr auto}
.pc-new{padding-top:8px;border-top:1px dashed var(--line)}
.pc-point{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.pc-point summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.pc-point[open] summary{margin-bottom:10px}
.chip-list{display:flex;flex-wrap:wrap;gap:8px}
.pc-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold-line);font-size:13px}
.pc-chip button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0}
@media (max-width:700px){.pc-row,.pc-anom{grid-template-columns:1fr 1fr}.pc-row input[type=text]:first-child{grid-column:1/-1}.pc-anom input:nth-child(3){grid-column:1/-1}}

/* Prestations / Matériel : grille achat-vente-marge, en lignes façon "carte" */
.pc-row-m{display:grid;grid-template-columns:2fr 100px 100px 76px 74px 90px auto;gap:8px;align-items:center;
  margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;
  transition:border-color .16s var(--ease),background-color .16s var(--ease)}
.pc-row-m:hover{border-color:var(--gold-line)}
.pc-row-m input,.pc-row-m select{background:var(--panel3)}
.pc-row-m.pc-head{background:none;border:none;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-dim);font-weight:700;margin-bottom:10px}
.pc-row-m.pc-new{margin-top:10px;border-style:dashed;border-color:var(--gold-line);background:var(--gold-soft)}
.pc-row-m.pc-new input,.pc-row-m.pc-new select{background:var(--panel2)}
.pc-del-txt{display:none}
.pc-marge{text-align:center;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:700}
.pc-marge.green{color:var(--green);background:var(--green-bg)}
.pc-marge.gold{color:var(--gold2);background:var(--gold-soft)}
.pc-marge.red{color:var(--red);background:var(--red-bg)}
.pc-marge.gray{color:var(--muted);background:var(--gray-bg)}
.pc-field{display:contents}
@media (max-width:900px){
  .pc-row-m{grid-template-columns:1fr 1fr;row-gap:12px;padding:14px}
  .pc-row-m.pc-head{display:none}
  .pc-row-m>.pc-field,.pc-row-m>.pc-marge{grid-column:span 1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .pc-row-m>.pc-field:before,.pc-row-m>.pc-marge:before{content:attr(data-label);font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-dim);font-weight:700}
  .pc-row-m>.pc-field[data-label="Désignation"]{grid-column:1/-1}
  .pc-row-m .pc-marge{justify-content:center;padding:9px 4px}
  .pc-row-m .pc-del{grid-column:1/-1;width:100%;margin-top:2px}
  .pc-del-txt{display:inline}
}
.marge-box{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:12px 14px;margin:14px 0}
.marge-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:3px 0}
.marge-row span{min-width:0}
.marge-row b{font-size:15px;white-space:nowrap;flex-shrink:0}
.cat-search{width:100%;margin-bottom:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font-size:14px}
.cat-search:focus{outline:none;border-color:var(--gold-line)}

.pc-row input,.pc-row select,.inv-row input,.inv-row select,.pc-point input,.mat-input,.pc-row-m input,.pc-row-m select,.devis-line-input,.devis-table-wrap select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;font-size:13.5px;width:100%}
.pc-row input:focus,.pc-row select:focus,.inv-row input:focus,.pc-row-m input:focus,.pc-row-m select:focus,.devis-line-input:focus,.devis-table-wrap select:focus{outline:none;border-color:var(--gold-line)}
.pc-row-m input[type=number],.devis-line-input[type=number]{padding:10px 8px}
.devis-table-wrap input,.devis-table-wrap select{background:var(--panel3)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
