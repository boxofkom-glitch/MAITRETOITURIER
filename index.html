<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maître Toiturier — Diagnostic & CRM</title>
<meta name="description" content="Demandes, diagnostics de toiture et suivi commercial dans un seul dossier.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0e12'/%3E%3Cpath d='M12 34 L32 16 L52 34' stroke='%23e8bf69' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 32 V48 H46 V32' stroke='%23e8bf69' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0e12; --panel:#14171e; --panel2:#191d25; --line:#292e39;
  --text:#edf0f5; --muted:#97a1b3; --gold:#e8bf69; --gold2:#c69a48;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
button,select,input,textarea{font-family:inherit}
#app{display:flex;min-height:100vh}

.sidebar{width:250px;flex-shrink:0;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px}
.logo-icon{width:38px;height:38px;border-radius:10px;background:#0c0e12;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line)}
.logo-icon svg{width:20px;height:20px}
.wordmark{font-weight:700;letter-spacing:.4px;font-size:13px;line-height:1.3}
.tagline{font-size:10px;color:var(--muted);letter-spacing:1.2px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:3px}
.nav-btn{text-align:left;padding:10px 12px;border-radius:8px;background:transparent;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;width:100%}
.nav-btn:hover{background:var(--panel);color:var(--text)}
.nav-btn.active{background:rgba(232,191,105,.13);color:var(--gold)}
.sidebar-footer{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-size:11.5px;color:var(--muted)}
.reset-btn{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:11.5px}
.reset-btn:hover{color:var(--text);border-color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.topbar-left .ws{font-size:14px;color:var(--text);font-weight:600}
.topbar-left .date{font-size:12.5px;color:var(--muted);text-transform:capitalize}
.topbar-right{display:flex;align-items:center;gap:12px}
.demo-tag{font-size:11.5px;color:var(--muted)}
.role-select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#0c0e12;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0}
.disclaimer{padding:8px 32px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2)}
.content{padding:28px 32px 60px;flex:1}

.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.page-header h1{font-size:22px;margin:0 0 4px;font-weight:700}
.page-header p{color:var(--muted);font-size:13.5px;margin:0;max-width:520px}
.btn-primary{background:var(--gold);color:#0c0e12;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-primary:hover{background:var(--gold2)}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-secondary:hover{border-color:var(--muted)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-ghost:hover{color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat-value{font-size:24px;font-weight:700}
.stat-label{font-size:13px;margin-top:5px}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.card-header h3{margin:0;font-size:14.5px}
.link-btn{background:none;border:none;color:var(--gold);font-size:12.5px;cursor:pointer;padding:0}
.empty-note{color:var(--muted);font-size:13px;padding:10px 0}

.row-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.row-item:last-child{border-bottom:none}
.row-left{display:flex;align-items:center;gap:10px;min-width:0}
.row-avatar{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.row-title{font-size:13.5px;font-weight:600}
.row-sub{font-size:12px;color:var(--muted)}
.date-tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:center;font-size:10.5px;font-weight:700;color:var(--gold);flex-shrink:0;line-height:1.2}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.red{color:rgb(241,154,138);background:rgb(56,36,37)}
.badge.blue{color:rgb(175,196,233);background:rgb(37,45,60)}
.badge.green{color:rgb(139,206,180);background:rgb(29,51,45)}
.badge.gray{color:rgb(185,199,220);background:rgb(44,49,62)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.filters-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters-row select,.filters-row input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px}
.filters-row input{flex:1;min-width:200px}

.breadcrumb{font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;margin-bottom:10px}
.breadcrumb:hover{color:var(--text)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 20px;overflow-x:auto}
.tab-btn{padding:10px 16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{margin:0;font-size:16px}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.form-field{margin-bottom:13px}
.form-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:8px;font-size:13px}
.form-field textarea{resize:vertical;min-height:64px}
.form-help{font-size:11.5px;color:var(--muted);margin-top:6px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-list-btn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:13px}
.modal-list-btn:hover{border-color:var(--gold)}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kanban-col{background:var(--panel2);border-radius:12px;padding:12px}
.kanban-col h4{font-size:12.5px;margin:0 0 10px;color:var(--muted);display:flex;justify-content:space-between}
.kanban-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px;font-size:12.5px}
.kanban-card .kc-id{color:var(--muted);font-size:11px}
.kanban-card .kc-name{font-weight:600;margin:2px 0}
.kanban-card .kc-sub{color:var(--muted);font-size:11.5px;margin-bottom:6px}
.kanban-card .kc-amount{color:var(--gold);font-weight:700;font-size:12.5px;margin:4px 0}

.agenda-topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.agenda-topbar .week-label{font-size:13.5px;font-weight:600;padding:0 6px}
.agenda-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;overflow-x:auto}
.agenda-day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:130px;min-width:120px}
.agenda-day h5{margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:600}
.agenda-day h5 b{color:var(--text);font-size:13px}
.agenda-event{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;margin-bottom:7px;font-size:11.5px;cursor:pointer}
.agenda-event:hover{border-color:var(--gold)}
.agenda-event .ev-time{color:var(--gold);font-weight:700}
.agenda-empty{color:var(--muted);font-size:11.5px;font-style:italic}

.diag-progress{font-size:12px;color:var(--muted);margin-bottom:6px}
.diag-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.diag-step-btn{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px}
.diag-step-btn.active{background:var(--gold);color:#0c0e12;border-color:var(--gold);font-weight:700}
.diag-step-btn.done{border-color:var(--gold2);color:var(--gold)}
.diag-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media (max-width:900px){.diag-layout{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(5,220px)}}
.diag-side .card{padding:16px}
.point-title{font-size:16px;font-weight:700;margin-bottom:4px}
.point-sub{font-size:12px;color:var(--muted);margin-bottom:16px}

.report-doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;font-size:13px;line-height:1.6}
.report-doc h2{font-size:18px;margin:0 0 2px}
.report-doc .rd-sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.report-doc .rd-section{margin-top:20px}
.report-doc .rd-section h4{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
.report-doc .rd-point{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:12px}
.report-doc .rd-quote{color:var(--muted);font-size:12.5px;font-style:italic;margin:4px 0 8px;padding-left:10px;border-left:2px solid var(--line)}
.report-doc .rd-choice{margin-bottom:14px}
.report-doc .rd-choice .rc-head{font-weight:700;margin-bottom:4px}
.report-doc .rd-footer{margin-top:24px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.progress-tracker{display:flex;margin-bottom:26px}
.progress-step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted)}
.progress-step .ps-dot{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:11px;font-weight:700}
.progress-step.done .ps-dot{background:var(--gold);color:#0c0e12;border-color:var(--gold)}
.progress-step.done{color:var(--text)}
.progress-step:not(:last-child):after{content:'';position:absolute;top:13px;left:60%;width:80%;height:1px;background:var(--line)}

.perm-list{list-style:none;padding:0;margin:10px 0 0;font-size:13px;color:var(--muted)}
.perm-list li{padding:5px 0 5px 18px;position:relative}
.perm-list li:before{content:'•';position:absolute;left:0;color:var(--gold)}
.role-card-title{font-size:15px;font-weight:700;margin-bottom:2px}
.role-card-sub{font-size:12.5px;color:var(--muted)}

.conn-card{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.conn-card h4{margin:0 0 4px;font-size:14.5px}
.conn-card p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.conn-card .conn-detail{font-size:12px;color:var(--muted)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
